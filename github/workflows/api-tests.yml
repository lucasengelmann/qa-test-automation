name: API Tests

# Run the API pipeline on code changes, pull requests, nightly schedule, or manual trigger.
on:
  push:
  pull_request:
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:

jobs:
  api:
    name: Newman Restful Booker
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # Download the repository source code into the runner.
      - name: Checkout repository
        uses: actions/checkout@v4

      # Install Node.js and enable npm dependency caching.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # Install dependencies from package-lock.json for reproducible CI runs.
      - name: Install dependencies
        run: npm ci

      # Execute the Postman collection with Newman and generate the HTML report.
      - name: Run API suite
        run: |
          mkdir -p reports
          npm run test:api

      # Publish the Newman HTML report even when the test step fails.
      - name: Upload API report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-reports
          path: |
            reports/newman-report.html
          if-no-files-found: warn
          retention-days: 14

      # Send a failure notification when SLACK_WEBHOOK_URL is configured as a repository secret.
      - name: Notify failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "SLACK_WEBHOOK_URL not configured; skipping failure notification."
            exit 0
          fi
          curl -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"API Tests falhou em ${GITHUB_REPOSITORY}. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}" \
            "$SLACK_WEBHOOK_URL"
